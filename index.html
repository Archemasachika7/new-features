<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Profile | JU Civil Martian</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="profile.css"/>
  <link href="https://fonts.googleapis.com/css?family=Orbitron:700|Roboto:400,700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>
  <!-- Dynamic Starfield and Orbits -->
  <canvas id="star-bg"></canvas>
  <div class="orbit-container">
    <div class="orbit orbit1"></div>
    <div class="orbit orbit2"></div>
    <div class="orbit orbit3"></div>
    <div class="orbit-rocket"><span>🚀</span></div>
  </div>
  <!-- Parallax Martian Background -->
  <div class="martian-bg">
    <div class="bg-stars"></div>
    <div class="bg-mountains"></div>
    <div class="bg-dust"></div>
  </div>
  <div class="section">
    <h2>Your Profile</h2>
    <div class="profile-card float-card glassy">
      <!-- Profile Picture Section -->
      <div class="profile-picture-section">
        <div id="profile-container" class="profile-pic-container">
          <img id="profileImage" src="" alt="Profile Picture" style="display: none;">
          <div class="profile-avatar" id="profileAvatar">🚀</div>
          <div class="profile-pic-overlay">
            <span>📷 Change Photo</span>
          </div>
        </div>
        <input id="imageUpload" type="file" accept="image/*" style="display: none;">
        <div class="profile-pic-actions">
          <button class="neon-btn small-btn" id="uploadPhotoBtn">Upload Photo</button>
          <button class="neon-btn small-btn" id="removePhotoBtn" style="display: none;">Remove Photo</button>
        </div>
      </div>

      <div class="profile-info">
        <div class="profile-row">
          <span>Name:</span>
          <span id="profileName"></span>
          <button class="edit-btn" id="editNameBtn" title="Edit Name">Edit</button>
        </div>
        <div class="profile-row">
          <span>Roll Number:</span>
          <span id="profileRoll"></span>
          <button class="edit-btn" id="editRollBtn" title="Edit Roll Number">Edit</button>
        </div>
        <div class="profile-row">
          <span>Subsection:</span>
          <span id="profileSubsection"></span>
          <button class="edit-btn" id="editSubsectionBtn" title="Edit Subsection">Edit</button>
        </div>
        <div class="profile-row">
          <span>LinkedIn:</span>
          <span id="profileLinkedIn">Not set</span>
          <button class="edit-btn" id="editLinkedInBtn" title="Edit LinkedIn">Edit</button>
          <a id="linkedInLink" href="#" target="_blank" style="display: none;" class="linkedin-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#0077b5">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </a>
        </div>
        <div class="profile-row">
          <span>Role:</span>
          <span id="profileRole"></span>
          <span class="admin-badge" id="adminBadge" style="display:none;">ADMIN</span>
        </div>
      </div>

      <!-- File Attachments Section -->
      <div class="profile-attachments">
        <h3>My Files & Documents</h3>
        <div class="attachment-upload">
          <input type="file" id="fileUpload" multiple style="display: none;">
          <button class="neon-btn" id="uploadFileBtn">📎 Upload Files</button>
        </div>
        <div id="filesList" class="files-list">
          <!-- Files will be displayed here -->
        </div>
      </div>

      <div class="profile-actions">
        <button class="neon-btn" id="changePasswordBtn">Change Password</button>
        <button class="neon-btn" id="gotoMainBtn">Back to Home</button>
      </div>
    </div>
  </div>

  <!-- Edit Name Modal -->
  <div class="modal" id="editNameModal">
    <div class="modal-content">
      <h3>Edit Name</h3>
      <form id="editNameForm">
        <input type="text" id="editNameInput" required maxlength="50"/>
        <button type="submit" class="neon-btn save-btn">Save</button>
        <button type="button" class="neon-btn cancel-btn" id="cancelEditName">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Edit Roll Number Modal -->
  <div class="modal" id="editRollModal">
    <div class="modal-content">
      <h3>Edit Roll Number</h3>
      <form id="editRollForm">
        <input type="text" id="editRollInput" required maxlength="20"/>
        <button type="submit" class="neon-btn save-btn">Save</button>
        <button type="button" class="neon-btn cancel-btn" id="cancelEditRoll">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Edit LinkedIn Modal -->
  <div class="modal" id="editLinkedInModal">
    <div class="modal-content">
      <h3>Edit LinkedIn Profile</h3>
      <form id="editLinkedInForm">
        <input type="url" id="editLinkedInInput" placeholder="https://linkedin.com/in/your-profile" maxlength="200"/>
        <small>Enter your full LinkedIn profile URL</small>
        <button type="submit" class="neon-btn save-btn">Save</button>
        <button type="button" class="neon-btn cancel-btn" id="cancelEditLinkedIn">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Edit Subsection Inline -->
  <select id="subsectionSelect" class="edit-select" style="display:none;">
    <option value="A1">A1</option>
    <option value="A2">A2</option>
    <option value="A3">A3</option>
  </select>
  <button class="save-btn" id="saveSubsectionBtn" style="display:none;">Save</button>

  <!-- Change Password Modal -->
  <div class="modal" id="changePasswordModal">
    <div class="modal-content">
      <h3>Change Password</h3>
      <form id="changePasswordForm">
        <input type="password" id="newPassword" placeholder="New Password" required minlength="6"/>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="6"/>
        <button type="submit" class="neon-btn save-btn">Change</button>
        <button type="button" class="neon-btn cancel-btn" id="cancelChangePassword">Cancel</button>
      </form>
    </div>
  </div>
  
  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loader"></div>
  </div>
  
  <script src="profile.js"></script>
</body>
</html>
